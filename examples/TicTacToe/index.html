<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="start-game-container">
    <div class="start-game">
        <h2>🎮 Start Game</h2>
        <p>Select your board size:</p>
        <select id="size-game">
            <option value="3">3x3</option>
            <option value="4">4x4</option>
            <option value="5">5x5</option>
            <option value="6">6x6</option>
        </select>

        <p>Select your player:</p>
        <div class="player-select">

        </div>

        <div class="game-button-container">
            <button id="start-game-button">Start Game</button>
        </div>
    </div>
</div>

<div class="game-ui" id="gameUI">
    <div class="status-bar">
        <div class="pill">Board: <span id="sizeLabel">3×3</span></div>
        <div class="pill">Current: <span id="turnLabel">X</span></div>
        <button id="resetBtn">Reset</button>
    </div>
    <div class="board" id="board"></div>
</div>

<div class="matriX">


</div>
<div class="game-end-container d-none" id="game-end-container">
<div class="end-game" id="end-game">
    <h2>Winner is</h2>
    <p>result A:   B:  </p>
    <div class="restart-game-button">
        <button id="restart-button">Restart</button>
    </div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
